    <script>
      // Applica il tema salvato prima del caricamento, evitando lampeggi.
      try {
        var schema = localStorage.getItem('mantine-color-scheme-value') || 'light';
        if (schema === 'auto') schema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', schema);
      } catch (e) {}
    </script>
